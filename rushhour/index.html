<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Rush Hour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="theme-color" content="#FFF9EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#FFF9EC;
    --surface:#FFFFFF;
    --surface-2:#FBF1DA;
    --line:#F0E4C9;
    --line-strong:#DFCEA6;

    --ink:#1B1810;
    --ink-2:#5B5240;
    --ink-3:#93896F;

    /* เหลืองมัสตาร์ดอ่อน */
    --accent:#FDBE21;
    --accent-deep:#8A6100;
    --accent-soft:#FFF3D2;
    --on-accent:#241900;

    --green:#2F7A4F;  --green-bg:#EAF3EC;
    --red:#B0452C;    --red-bg:#FBEDE9;
    --amber:#96690D;  --amber-bg:#FBF3E0;

    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(26,24,20,.05);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans Thai","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px; line-height:1.55;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{ font-family:inherit; font-size:16px; color:inherit; }
  input,select,textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line-strong);
    border-radius:var(--radius-sm); background:var(--surface); outline:none;
  }
  input:focus,select:focus,textarea:focus{ border-color:var(--accent-deep); }
  h1,h2,h3{ margin:0; font-weight:800; letter-spacing:-.01em; }

  /* ---------- app bar ---------- */
  .appbar{
    position:sticky; top:0; z-index:50;
    background:rgba(255,249,236,.94); backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .appbar-inner{
    display:flex; align-items:center; gap:12px;
    max-width:560px; margin:0 auto; padding:10px 16px;
  }
  .brand{ display:flex; align-items:center; gap:9px; flex:1; min-width:0; }
  .wordmark-img{ height:30px; width:auto; display:block; }
  .wm-app{
    font-size:11px; font-weight:700; letter-spacing:.16em;
    color:var(--ink-3); white-space:nowrap;
  }
  .clock{ text-align:right; line-height:1.2; }
  .clock .t{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
  .clock .d{ font-size:11px; color:var(--ink-3); }

  /* ---------- layout ---------- */
  .wrap{ max-width:560px; margin:0 auto; padding:14px 16px 8px; }
  .sub{ margin:0 0 12px; font-size:13px; color:var(--ink-3); }

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; margin-bottom:12px;
  }

  /* ---------- chips ---------- */
  .chiprow{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{
    padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-2); font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  /* ---------- buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; border-radius:var(--radius-sm);
    border:1px solid var(--line-strong); background:var(--surface);
    font-weight:650; cursor:pointer;
  }
  .btn-primary{ background:var(--ink); border-color:var(--ink); color:#fff; font-weight:700; }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700; }
  .btn-sm{
    width:auto; padding:8px 12px; font-size:13px; border-radius:9px;
    border:1px solid var(--line-strong); background:var(--surface); cursor:pointer; font-weight:650;
  }
  .btn-sm.solid{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .btn-sm.danger{ color:var(--red); border-color:#E8D2CB; }

  /* ---------- kpi ---------- */
  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 12px; }
  .kpi{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:12px 14px;
  }
  .kpi.wide{ grid-column:1 / -1; }
  .kpi-label{ margin:0 0 2px; font-size:11.5px; color:var(--ink-3); }
  .kpi-val{ margin:0; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
  .kpi.warn{ border-left:3px solid var(--amber); }
  .kpi.bad { border-left:3px solid var(--red); }
  .kpi.warn .kpi-val{ color:var(--amber); font-size:28px; }
  .kpi.bad  .kpi-val{ color:var(--red);   font-size:28px; }
  .pos{ color:var(--green); } .neg{ color:var(--red); }

  /* ---------- rows ---------- */
  .row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:7px 0; gap:12px;
  }
  .row + .row{ border-top:1px dashed var(--line); }
  .row .k{ font-size:13px; color:var(--ink-2); }
  .row .v{ font-weight:700; font-variant-numeric:tabular-nums; }

  .it-row{
    background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:12px 13px; margin-bottom:8px;
  }
  .it-row.low{ border-left:3px solid var(--amber); }
  .it-row.out{ border-left:3px solid var(--red); }
  .it-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .it-name{ font-weight:700; }
  .it-qty{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .mini{ font-size:12px; color:var(--ink-3); }
  .acts{ display:flex; gap:6px; justify-content:flex-end; margin-top:9px; }

  .gauge{ height:5px; border-radius:3px; background:#EFEDE5; overflow:hidden; margin:8px 0 4px; }
  .gauge > span{ display:block; height:100%; background:var(--ink-3); }

  /* ---------- table (summary) ---------- */
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th,.tbl td{ padding:8px 6px; text-align:right; white-space:nowrap; }
  .tbl th{ color:var(--ink-3); font-weight:600; font-size:11.5px; border-bottom:1px solid var(--line); }
  .tbl td{ border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .tbl th:first-child,.tbl td:first-child{ text-align:left; }
  .tbl tfoot td{ font-weight:800; border-top:2px solid var(--line-strong); border-bottom:none; }
  .scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -14px; padding:0 14px; }

  /* ---------- empty / loading ---------- */
  .empty{ text-align:center; color:var(--ink-3); padding:44px 16px; }
  .empty .big{ display:block; font-size:30px; margin-bottom:8px; opacity:.6; }
  .skel{ height:74px; border-radius:12px; background:linear-gradient(90deg,#F1EEE6,#F7F5EF,#F1EEE6);
         background-size:200% 100%; animation:sk 1.2s infinite; margin-bottom:8px; }
  @keyframes sk{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ---------- modal sheet ---------- */
  .overlay{
    position:fixed; inset:0; z-index:200; background:rgba(26,24,20,.34);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    background:var(--surface); border-radius:20px 20px 0 0;
    padding:8px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .grab{ width:38px; height:4px; border-radius:2px; background:var(--line-strong); margin:6px auto 14px; }
  .lbl{ display:block; font-size:12.5px; color:var(--ink-2); margin:10px 0 5px; font-weight:600; }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(96px + env(safe-area-inset-bottom)); z-index:300;
    background:var(--ink); color:#fff; padding:11px 17px; border-radius:11px;
    font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:.2s;
    max-width:88vw; text-align:center;
  }
  #toast.show{ opacity:1; }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:rgba(255,255,255,.96); backdrop-filter:saturate(1.4) blur(12px);
    border-top:1px solid var(--line);
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  }
  .nav-inner{ display:flex; max-width:560px; margin:0 auto; gap:4px; }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:7px 2px; border:none; background:none; cursor:pointer;
    color:var(--ink-3); font-size:10.5px; font-weight:700; position:relative;
  }
  .nav-item svg{ width:22px; height:22px; }
  .nav-item.active{ color:var(--ink); }
  .nav-item.active::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:2px;
    width:20px; height:2.5px; border-radius:2px; background:var(--accent-deep);
  }

  /* ---------- print (PDF) ---------- */
  @media print{
    .appbar,.bottom-nav,.no-print,#toast{ display:none !important; }
    body{ padding:0; background:#fff; }
    .wrap{ max-width:none; padding:0; }
    .card{ border:none; padding:0; }
    .tbl{ font-size:11px; }
    .scroll-x{ overflow:visible; margin:0; padding:0; }
    @page{ margin:14mm; }
  }
  .shop-pill{ display:inline-flex; align-items:center; height:17px; padding:0 7px; border-radius:999px;
    background:var(--accent); color:var(--on-accent); font-size:10px; font-weight:800; letter-spacing:.12em; }
</style>
</head>
<body id="bodyEl">

<div class="appbar">
  <div class="appbar-inner">

  .shoot{width:100%;border:0;border-radius:20px;background:var(--ink);color:#fff;

<script>
/* =========================================================
   Rush Hour — แอปรวม
   หมวด 1 สรุปรวม (อ่านอย่างเดียว + PDF + ตอกบัตร)
   หมวด 2 บาร์น้ำ / หมวด 3 เบเกอรี่  (สต๊อก · บันทึกรายวัน · ต้นทุน)
   ยอดของหมวด 2-3 ไหลเข้าหมวด 1 เองเพราะเขียนลงชีตเดียวกัน
   ========================================================= */

const API_URL = "https://script.google.com/macros/s/AKfycbwpQ2EmK5kFVAjvN4gp2ZluMdKYq8ETnAa7p6_H1QRz9R_LFeEoJh03VfB-u0Lat-Mt/exec";
const ATTEND_URL = "../staff/?embed=1&branch=rushhour";
// อ่านข้อมูลตรงจากชีต เร็วกว่าผ่าน Apps Script ราว 10-25 เท่า
// (ชีตตั้งเป็น "ทุกคนที่มีลิงก์ · ผู้มีสิทธิ์อ่าน" — อ่านได้อย่างเดียว เขียนยังต้องผ่าน Apps Script)
const SS_ID = "1oLaH0ChTbekwkcjQQFaT8e4t1fIfzO5o7zE_en8MVs8";
const SHOP   = "rushhour";

const DEPT_LABEL = { bar:"บาร์น้ำ", bakery:"เบเกอรี่" };

const state = {
  section: "home",             // home | summary | attend
  tab: "daily",                // stock | daily | cost   (ในหมวดแผนก)
  subTab: "sales",             // sales | attend         (ในหมวดสรุป)
  period: "month",             // day | week | month | custom
  rangeFrom: "", rangeTo: "",
  cat: "all", q: "",
  formOpen:false, loaded:false,
  data: { bar:null, bakery:null },
  fixed: null, fixEdit: null, fixMonth: "", fixDel: [],
  dayClose: null, dcEdit: null, photos: [], justShot: [],   // bootstrap ต่อแผนก
  roll: null                          // rollup สำหรับหมวดสรุป
};

/* ---------------- helpers ---------------- */
function n2(v){ const n = parseFloat(String(v==null?"":v).replace(/[, ]/g,"")); return isNaN(n)?0:n; }
function fmtN(v){ const n=n2(v); return (Math.round(n*100)/100).toLocaleString("en-US"); }
function fmtB(v){ return fmtN(v); }
function pad2(n){ return n<10?"0"+n:""+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function normDate(v){ return String(v==null?"":v).slice(0,10); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

const TH_MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function thDate(iso){
  const p = String(iso||"").slice(0,10).split("-");
  if(p.length<3) return String(iso||"");
  return parseInt(p[2],10) + " " + TH_MON[parseInt(p[1],10)-1];
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__tt); window.__tt=setTimeout(function(){ t.classList.remove("show"); },2600);
}

function tickClock(){
  const d=new Date();
  document.getElementById("clockT").textContent = pad2(d.getHours())+":"+pad2(d.getMinutes());
  const wd=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"][d.getDay()];
  document.getElementById("clockD").textContent = wd+" "+pad2(d.getDate())+" "+TH_MON[d.getMonth()];
}

async function apiCall(action, payload){
  const body = "action="+encodeURIComponent(action)+"&payload="+encodeURIComponent(JSON.stringify(Object.assign({shop:SHOP}, payload||{})));
  let lastErr = null;
  // Apps Script ตอบ 404/5xx ชั่วคราวได้บ่อยหลังอัปเดต — ลองซ้ำเองแทนที่จะเด้ง error ใส่หน้าน้อง
  for(let i=0; i<3; i++){
    try{
      const res = await fetch(API_URL, {
        method:"POST",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: body
      });
      const text = await res.text();
      if(!res.ok){
        lastErr = new Error("เซิร์ฟเวอร์ตอบกลับ HTTP "+res.status);
        if(res.status === 404 || res.status >= 500){ await naptime(700*(i+1)); continue; }
        throw lastErr;
      }
      try{ return JSON.parse(text); }
      catch(e){ throw new Error("รูปแบบข้อมูลไม่ถูกต้อง: "+text.slice(0,120)); }
    }catch(e){
      lastErr = e;
      if(i === 2) break;
      await naptime(700*(i+1));
    }
  }
  throw lastErr || new Error("เชื่อมต่อไม่ได้");
}

function naptime(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

/* ---------------- data ---------------- */

function cacheKey(){ return "rushBoot"; }

function saveCache(){
  try{
    localStorage.setItem(cacheKey(), JSON.stringify({
      d: todayStr(), data: state.data, roll: state.roll, fixed: state.fixed, dayClose: state.dayClose, photos: state.photos
    }));
  }catch(e){}
}

function bootFromCache(){
  try{
    const c = JSON.parse(localStorage.getItem(cacheKey()) || "null");
    if(c && c.data && c.data.bar && c.data.bakery){
      const sameDay = (c.d === todayStr());
      state.data     = c.data;
      state.roll     = c.roll || null;
      state.fixed    = c.fixed || null;
      state.dayClose = sameDay ? (c.dayClose || null) : null;   // ของเมื่อวานไม่เอามาปนวันนี้
      state.photos   = sameDay ? (c.photos || []) : [];
      state.loaded   = true;
      render();
      return true;
    }
  }catch(e){}
  return false;
}

function showError(msg){
  document.getElementById("errorBox").innerHTML = msg
    ? '<div class="card" style="background:var(--red-bg);border-color:#EED9D2;color:#7A2C1B;font-size:12.5px;line-height:1.5">'

/** โหลดทั้งสองแผนกในคำขอเดียว — Apps Script คิดเวลาต่อคำขอ ~3-4 วิ ยิงน้อยครั้งที่สุดคือเร็วที่สุด */
/* ---------------- อ่านชีตตรง ---------------- */

let gvSeq = 0;

/** แปลงตารางที่ gviz ส่งมาเป็น array ของ object ตามหัวคอลัมน์ */
function gvRows(o){
  const t = (o && o.table) || {};
  const cols = (t.cols || []).map(function(c){ return String((c && (c.label || c.id)) || "").trim(); });
  return (t.rows || []).map(function(r){
    const obj = {};
    (r.c || []).forEach(function(cell, i){
      const key = cols[i];
      if(!key) return;
      let v = cell ? cell.v : "";
      if(typeof v === "string" && v.indexOf("Date(") === 0){
        const p = v.slice(5, -1).split(",").map(Number);
        v = p[0] + "-" + pad2(p[1] + 1) + "-" + pad2(p[2]);
      }
      obj[key] = (v === null || v === undefined) ? "" : v;
    });
    return obj;
  });
}

/** ดึงหนึ่งชีตผ่าน gviz (ใช้ script tag เพราะ endpoint นี้ไม่เปิด CORS) */
function gvFetch(sheet){
  return new Promise(function(resolve, reject){
    const cb = "__gv" + (++gvSeq) + "_" + Date.now();
    const sc = document.createElement("script");
    let settled = false;
    const finish = function(ok, val){
      if(settled) return;
      settled = true;
      clearTimeout(tm);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(sc.parentNode) sc.parentNode.removeChild(sc);
      ok ? resolve(val) : reject(val);
    };
    const tm = setTimeout(function(){ finish(false, new Error("ชีต " + sheet + " ตอบช้าเกินไป")); }, 15000);
    window[cb] = function(o){ finish(true, gvRows(o)); };
    sc.onerror = function(){ finish(false, new Error("อ่านชีต " + sheet + " ไม่ได้")); };
    sc.src = "https://docs.google.com/spreadsheets/d/" + SS_ID
           + "/gviz/tq?tqx=out:json;responseHandler:" + cb
           + "&sheet=" + encodeURIComponent(sheet) + "&headers=1&_=" + Date.now();
    document.head.appendChild(sc);
  });
}

function gvNum(r, k){ return n2(r[k]); }

/** โหลดทุกอย่างตรงจากชีต — 8 ตารางพร้อมกัน ปกติจบใน ~2 วินาที */

    gvFetch("Purchases"), gvFetch("DailySummary"), gvFetch("Fixed"), gvFetch("DayClose")
  ]);
  const items = res[0], income = res[1], expense = res[2], recipes = res[3],
        purch = res[4], summ = res[5], fixed = res[6], dayc = res[7];

  const mine = function(rows, dept){
    return rows.filter(function(r){ return String(r.dept || "") === dept; });
  };

  ["bar","bakery"].forEach(function(dept){
    const sm = summ.filter(function(r){
      return normDate(r.date) === date && String(r.dept || "all") === dept;
    });
    state.data[dept] = {
      items:  mine(items, dept).map(function(it){ return Object.assign({}, it, {
                qty:n2(it.qty), min:n2(it.min), cost:n2(it.cost) }); }),
      log: [],
      income: mine(income, dept).map(function(r){ return Object.assign({}, r, {
                amount:n2(r.amount), date:normDate(r.date) }); }),
      expense: mine(expense, dept).map(function(r){ return Object.assign({}, r, {
                amount:n2(r.amount), date:normDate(r.date) }); }),
      recipes: mine(recipes, dept).map(function(r){ return Object.assign({}, r, {
                sellingPrice:n2(r.sellingPrice), servings:n2(r.servings),
                ingredientQty:n2(r.ingredientQty), buyPrice:n2(r.buyPrice),
                packSize:n2(r.packSize) }); }),
      purchases: mine(purch, dept).filter(function(r){ return normDate(r.date) === date; })
                 .map(function(r){ return Object.assign({}, r, {
                   amount:n2(r.amount), date:normDate(r.date) }); }),
      summary: sm.length ? sm[0] : null
    };
  });

  state.fixed = fixed;
  state.photos = purch.filter(function(r){ return normDate(r.date) === date; })
                     .map(function(r){ return Object.assign({}, r, { amount:n2(r.amount) }); });

function localAdd(dept, kind, row){
  const d = state.data[dept];
  if(!d) return;
  (kind === "income" ? d.income : d.expense).unshift(row);
  state.roll = computeRoll();
  saveCache();
  render();
}

function localSet(dept, kind, row){
  const d = state.data[dept];
  if(!d) return;
  const arr = (kind === "income" ? d.income : d.expense);
  const at = arr.findIndex(function(x){ return String(x.id) === String(row.id); });
  if(at >= 0) arr[at] = row; else arr.unshift(row);
  state.roll = computeRoll();
  saveCache();
  render();
}

/* ---------------- period ---------------- */

function cycleIndex(day){ return day<=5?0:day<=10?1:day<=15?2:day<=20?3:day<=25?4:5; }

function computeRoll(){
  const r = periodRange();
  const days = {};
  const slot = function(d){
    if(!days[d]) days[d] = { date:d, bar:{sales:0,expense:0,delivery:0}, bakery:{sales:0,expense:0,delivery:0} };
    return days[d];
  };
  ["bar","bakery"].forEach(function(dp){
    const d = state.data[dp]; if(!d) return;
    (d.income||[]).forEach(function(x){
      const dt = normDate(x.date); if(dt<r.from || dt>r.to) return;
      slot(dt)[dp].sales += n2(x.amount);
      if(String(x.channel||"")==="delivery") slot(dt)[dp].delivery += n2(x.amount);
    });
    (d.expense||[]).forEach(function(x){
      const dt = normDate(x.date); if(dt<r.from || dt>r.to) return;
      slot(dt)[dp].expense += n2(x.amount);
    });
  });
  const list = Object.keys(days).sort().map(function(k){
    const x = days[k];
    const sales = x.bar.sales + x.bakery.sales;
    const expense = x.bar.expense + x.bakery.expense;
    return { date:k, barSales:x.bar.sales, barExpense:x.bar.expense,
             bakerySales:x.bakery.sales, bakeryExpense:x.bakery.expense,
             barDelivery:x.bar.delivery, bakeryDelivery:x.bakery.delivery,
             delivery:x.bar.delivery + x.bakery.delivery,
             sales:sales, expense:expense, profit:sales-expense };
  });
  const totals = list.reduce(function(a,x){
    a.barSales+=x.barSales; a.barExpense+=x.barExpense;
    a.bakerySales+=x.bakerySales; a.bakeryExpense+=x.bakeryExpense;
    a.delivery+=x.delivery; a.sales+=x.sales; a.expense+=x.expense; a.profit+=x.profit;
    return a;
  }, {barSales:0,barExpense:0,bakerySales:0,bakeryExpense:0,delivery:0,sales:0,expense:0,profit:0});

  // รอบจ่ายเดลิเวอรี่ 5 วัน ของเดือนปัจจุบัน
  const ym = todayStr().slice(0,8);
  const p2 = function(n){ return (n<10?"0":"")+n; };
  const bounds = [[1,5],[6,10],[11,15],[16,20],[21,25],[26,31]];
  const cycles = bounds.map(function(c){
    return { from: ym+p2(c[0]), to: ym+p2(c[1]), bar:0, bakery:0, total:0 };
  });
  ["bar","bakery"].forEach(function(dp){
    const d = state.data[dp]; if(!d) return;
    (d.income||[]).forEach(function(x){
      if(String(x.channel||"")!=="delivery") return;
      const dt = normDate(x.date); if(dt.slice(0,8)!==ym) return;
      const i = cycleIndex(parseInt(dt.slice(8,10),10));
      cycles[i][dp] += n2(x.amount); cycles[i].total += n2(x.amount);
    });
  });
  const fxRows = fixedBooked(r.from, r.to);
  let fxSum = 0; fxRows.forEach(function(x){ fxSum += n2(x.total); });
  totals.fixed = fxSum;
  totals.net   = totals.profit - fxSum;

  return { from:r.from, to:r.to, days:list, totals:totals, cycles:cycles, fixed:fxRows };
}

/* ==================== รายจ่ายคงที่ ====================
   แม่แบบ (kind="tpl") ตั้งครั้งเดียว ใช้วนทุกเดือน
   เดือนไหนจ่ายไม่เท่าแม่แบบ เก็บเป็น kind="one" ทับเฉพาะเดือนนั้น
   ยอดของแต่ละเดือนลงบัญชีที่ "วันสิ้นเดือน"
   ====================================================== */

const FIX_PRESET = ["ค่าเช่า","ค่าน้ำ","ค่าไฟ","ค่าจ้าง","ค่าการตลาด"];

function fxTpl(){ return (state.fixed||[]).filter(function(r){ return String(r.kind||"tpl")==="tpl"; }); }
function fxOne(ym){ return (state.fixed||[]).filter(function(r){ return String(r.kind)==="one" && String(r.month)===ym; }); }

function monthEnd(ym){
  const y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
  const d = new Date(y, m, 0);
  return ym + "-" + pad2(d.getDate());
}
function thMonth(ym){ return TH_MON[parseInt(ym.slice(5,7),10)-1] + " " + ym.slice(0,4); }

function fixedForMonth(ym){
  const tpl = fxTpl(), one = fxOne(ym), out = [];
  tpl.forEach(function(t){
    let ov = null;
    one.forEach(function(o){ if(String(o.category)===String(t.category)) ov = o; });
    out.push({ id: ov?String(ov.id):String(t.id), category:String(t.category),
               amount: ov?n2(ov.amount):n2(t.amount), over: !!ov });
  });
  one.forEach(function(o){
    let dup = false;
    tpl.forEach(function(t){ if(String(t.category)===String(o.category)) dup = true; });
    if(!dup) out.push({ id:String(o.id), category:String(o.category), amount:n2(o.amount), over:true });
  });
  return out;
}

function fixedBooked(from, to){
  const out = [];
  let y = parseInt(from.slice(0,4),10), m = parseInt(from.slice(5,7),10);
  const ly = parseInt(to.slice(0,4),10), lm = parseInt(to.slice(5,7),10);
  let guard = 0;
  while((y < ly || (y === ly && m <= lm)) && guard++ < 400){
    const ym = y + "-" + pad2(m);
    const e = monthEnd(ym);
    if(e >= from && e <= to){
      const items = fixedForMonth(ym);
      let sum = 0; items.forEach(function(x){ sum += n2(x.amount); });
      if(sum) out.push({ ym:ym, date:e, items:items, total:sum });
    }
    m++; if(m > 12){ m = 1; y++; }
  }
  return out;
}

function fixedPending(){
  const r = periodRange();
  const ym = r.to.slice(0,7);
  const e = monthEnd(ym);
  if(e <= r.to) return null;
  const items = fixedForMonth(ym);
  let sum = 0; items.forEach(function(x){ sum += n2(x.amount); });
  if(!sum) return null;
  return { ym:ym, date:e, items:items, total:sum };
}

function fxLines(m){
  return m.items.map(function(x){
      if(!n2(x.amount)) return "";
      return '<div class="row"><span class="k">' + escapeHtml(x.category) + '</span>'
           + '<span class="v" style="color:var(--red)">' + fmtB(x.amount) + '</span></div>';
    }).join("")
    + '<div class="row"><span class="k"><b>รวม</b></span>'
    + '<span class="v"><b style="color:var(--red)">' + fmtB(m.total) + '</b></span></div>';
}

function fixedCard(){
  const roll = state.roll; if(!roll) return "";
  const rows = roll.fixed || [];
  const pend = fixedPending();
  if(!rows.length && !pend) return "";
  return '<div class="card">'
    + '<div style="font-weight:800;font-size:14px;margin-bottom:8px">รายจ่ายคงที่</div>'
    + rows.map(function(m){
        return '<div class="mini" style="margin:0 0 4px">' + thMonth(m.ym) + ' · ลงบัญชี ' + thDate(m.date) + '</div>'
             + fxLines(m);
      }).join("")
    + (pend
       ? '<div class="mini" style="margin:' + (rows.length ? '12px' : '0') + ' 0 4px;color:var(--ink-3)">'
         + thMonth(pend.ym) + ' · ยังไม่ลงบัญชี จะรวมให้วันที่ ' + thDate(pend.date) + '</div>'
         + '<div style="opacity:.6">' + fxLines(pend) + '</div>'
       : "")
    + '</div>';
}

    +   '<input type="month" value="' + ym + '" onchange="fxSetMonth(this.value)" style="margin-bottom:12px">'
    +   (items.length
        ? items.map(function(x, i){
            return '<div class="fx-row">'
              + '<span class="fx-txt">' + escapeHtml(x.category) + (x.over ? '<span class="fx-tag">แก้แล้ว</span>' : '') + '</span>'
              + '<input type="number" inputmode="decimal" value="' + (n2(x.amount) || "") + '" onchange="fxOverrideAt(' + i + ',this.value)">'
              + (x.over ? '<button class="fx-x" onclick="fxClearOverride(&#39;' + escapeHtml(x.id) + '&#39;)" title="กลับไปใช้แม่แบบ">↺</button>' : '<span class="fx-x ghost"></span>')
              + '</div>';
          }).join("")
        : '<div class="empty"><span class="big">◻</span>ยังไม่ได้ตั้งแม่แบบ</div>')
    +   '<div class="row" style="margin-top:12px"><span class="k">รวมเดือน ' + thMonth(ym) + '</span>'
    +     '<span class="v"><b style="color:var(--red)">' + fmtB(mTotal) + ' ฿</b></span></div>'
    + '</div>';

  return head + fxStyle() + tplCard + monthCard;
}

function periodRange(){
  const today = todayStr();
  if(state.period === "day")   return { from: today, to: today };
  if(state.period === "week"){
    const d = new Date(); d.setDate(d.getDate()-6);
    return { from: d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()), to: today };
  }
  if(state.period === "custom"){
    return { from: state.rangeFrom || today.slice(0,8)+"01", to: state.rangeTo || today };
  }
  return { from: today.slice(0,8)+"01", to: today };   // month
}

function periodLabel(){
  const r = periodRange();
  if(state.period==="day") return "วันนี้";
  if(state.period==="week") return "7 วันล่าสุด";
  if(state.period==="month") return "เดือนนี้";
  return thDate(r.from) + " – " + thDate(r.to);
}

function inPeriod(dateStr){
  const r = periodRange(); const d = normDate(dateStr);
  return d >= r.from && d <= r.to;
}

function periodChips(){
  const opts = [["day","วันนี้"],["week","7 วัน"],["month","เดือนนี้"],["custom","กำหนดเอง"]];
  return '<div class="chiprow no-print">'
    + opts.map(function(o){
        return '<button class="chip '+(state.period===o[0]?"active":"")
             + '" onclick="setPeriod(\''+o[0]+'\')">'+o[1]+'</button>';
      }).join("")
    + '</div>'
    + (state.period==="custom" ? rangeFields() : "");
}

function rangeFields(){
  const r = periodRange();
  return '<div class="card no-print" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px">'
    + '<div><label class="lbl" style="margin-top:0">ตั้งแต่</label>'
    +   '<input type="date" value="'+r.from+'" onchange="state.rangeFrom=this.value;refresh(true)"></div>'
    + '<div><label class="lbl" style="margin-top:0">ถึง</label>'
    +   '<input type="date" value="'+r.to+'" onchange="state.rangeTo=this.value;refresh(true)"></div>'
    + '</div>';
}

function setPeriod(p){
  state.period = p;
  saveNav();
  if(p==="custom" && !state.rangeFrom){
    const t=todayStr(); state.rangeFrom=t.slice(0,8)+"01"; state.rangeTo=t;
  }
  if(state.section==="summary"){ state.roll = computeRoll(); render(); } else render();
}

/* ---------------- navigation ---------------- */

function saveNav(){
  try{ localStorage.setItem("rushNav", JSON.stringify({
    section: state.section, tab: state.tab, subTab: state.subTab, period: state.period,
    rangeFrom: state.rangeFrom, rangeTo: state.rangeTo
  })); }catch(e){}
}

function restoreNav(){
  let n = null;
  try{ n = JSON.parse(localStorage.getItem("rushNav") || "null"); }catch(e){}
  const sec = (n && ["home","summary","attend"].indexOf(n.section) >= 0) ? n.section : "home";
  setSection(sec);
  if(n){
    if(["day","week","month","custom"].indexOf(n.period) >= 0) state.period = n.period;
    if(n.rangeFrom) state.rangeFrom = n.rangeFrom;
    if(n.rangeTo)   state.rangeTo   = n.rangeTo;
    if(sec === "summary" && ["sales","fixed"].indexOf(n.subTab) >= 0) state.subTab = n.subTab;
    render();
  }
}

function setSection(s){
  state.section = s;
  if(s !== "summary") state.subTab = "sales";
  [["home","navHome"],["summary","navSummary"],["attend","navAttend"]].forEach(function(p){
    const el = document.getElementById(p[1]);
    if(el) el.classList.toggle("active", s === p[0]);
  });
  const tag = { home:"หน้าแรก", summary:"สรุป", attend:"ตอกบัตร" }[s] || "";
  document.getElementById("sectionTag").textContent = tag;
  window.scrollTo(0,0);
  saveNav();
  render();
  refresh(true);
}


function setSubTab(t){ state.subTab = t; saveNav(); window.scrollTo(0,0); render(); if(t==="fixed" && !state.fixed) refresh(true); }



/* ---------------- render dispatch ---------------- */

function render(){
  const title = document.getElementById("pageTitle");
  const sub   = document.getElementById("pageSub");
  const box   = document.getElementById("content");

  if(state.section === "attend"){
    title.textContent = "ตอกบัตร";
    sub.textContent   = "เข้า-ออกงาน";
    box.innerHTML     = renderAttend();
    return;
  }

  if(state.section === "summary"){
    title.textContent = "สรุป";
    sub.textContent   = state.loaded ? "ยอดย้อนหลัง แยกบาร์น้ำกับเบเกอรี่" : "กำลังโหลดข้อมูล…";
    box.innerHTML     = (state.subTab === "fixed") ? renderFixed() : renderSummary();
    return;
  }

  title.textContent = "วันนี้";
  if(!state.data.bar || !state.data.bakery){
    sub.textContent = "กำลังโหลดข้อมูล…";
    box.innerHTML   = skeleton();
    return;
  }
  sub.textContent = "ถ่ายบิลแล้วจบ ที่เหลือผมจัดให้";
  box.innerHTML   = renderHome();
}

function currentCycle(){
  return cycleIndex(parseInt(todayStr().slice(8,10),10));
}

function cycleLabel(c){
  const a = parseInt(c.from.slice(8,10),10);
  let b = parseInt(c.to.slice(8,10),10);
  const last = new Date(parseInt(c.to.slice(0,4),10), parseInt(c.to.slice(5,7),10), 0).getDate();
  if(b > last) b = last;
  return a + "–" + b + " " + TH_MON[parseInt(c.to.slice(5,7),10)-1];
}

function deliveryCard(){
  const roll = state.roll;
  if(!roll || !roll.cycles) return "";
  const cur = currentCycle();
  const c = roll.cycles[cur];
  const monthTotal = roll.cycles.reduce(function(a,x){ return a + n2(x.total); }, 0);

  const line = function(x, i){
    const now = i === cur;
    return '<div class="row" style="' + (now ? 'background:var(--accent-soft);margin:0 -14px;padding:8px 14px' : '') + '">'
      + '<span class="k" style="' + (now ? 'font-weight:700;color:var(--ink)' : '') + '">'
      +   cycleLabel(x) + (now ? ' <span style="font-size:11px;color:var(--accent-deep)">· รอบนี้</span>' : '')
      + '</span>'
      + '<span class="v" style="font-size:14px">'
      +   (n2(x.total)
          ? ('<span style="font-size:11.5px;color:var(--ink-3);font-weight:500">'
             + fmtB(x.bar) + ' + ' + fmtB(x.bakery) + ' · </span>' + fmtB(x.total))
          : '<span style="color:var(--ink-3);font-weight:500">—</span>')
      + '</span></div>';
  };

  return '<div class="card">'
    + '<div style="font-weight:800;font-size:15px;margin-bottom:2px">Delivery · รอบ 5 วัน</div>'
    + '<div class="mini" style="margin-bottom:10px">สรุปลง Drive ทุกวันที่ 1 · 6 · 11 · 16 · 21 · 26</div>'
    + '<div style="font-size:11.5px;color:var(--ink-3)">รอบนี้ ' + cycleLabel(c) + '</div>'
    + '<div style="font-size:28px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums">'
    +   fmtB(c.total) + ' <span style="font-size:15px;color:var(--ink-3)">฿</span></div>'
    + '<div class="mini" style="margin-bottom:10px">บาร์น้ำ ' + fmtB(c.bar) + ' · เบเกอรี่ ' + fmtB(c.bakery) + '</div>'
    + '<div style="border-top:1px dashed var(--line);padding-top:4px">'
    +   roll.cycles.map(line).join('')
    + '</div>'
    + '<div class="row" style="border-top:2px solid var(--line-strong);margin-top:2px">'
    +   '<span class="k" style="font-weight:700;color:var(--ink)">รวมทั้งเดือน</span>'
    +   '<span class="v" style="font-size:16px">' + fmtB(monthTotal) + '</span>'
    + '</div></div>';
}

    +   '<b class="'+(p>=0?"pos":"neg")+'">'+(p>=0?"+":"−")+fmtB(Math.abs(p))+'</b></span>'

/* ---------------- หน้าแรก ---------------- */

function renderHome(){
  const day = todayStr();
  const rows = [];
  ["bar","bakery"].forEach(function(dp){
    const x = state.data[dp];
    if(!x) return;
    (x.income  || []).forEach(function(r){
      if(normDate(r.date) === day) rows.push(Object.assign({}, r, { kind:"in",  dept:dp }));
    });
    (x.expense || []).forEach(function(r){
      if(normDate(r.date) === day) rows.push(Object.assign({}, r, { kind:"out", dept:dp }));
    });
  });
  rows.sort(function(a,b){ return String(b.created||"").localeCompare(String(a.created||"")); });

  const list = rows.length
    ? '<div class="card"><div style="font-weight:800;font-size:14px;margin-bottom:2px">รายการวันนี้</div>'
      + rows.map(homeRow).join("")
      + '</div>'
    : "";

  const acts = '<div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    + '<button class="btn" onclick="openSaleForm()">+ ยอดขาย</button>'
    + '<button class="btn" onclick="openBuyForm()">+ ค่าใช้จ่าย</button>'
    + '</div>';

  return receiptCard() + todayCard() + list + acts;
}

function homeRow(r){
  const isIn  = r.kind === "in";
  const label = isIn ? (String(r.channel||"store") === "store" ? "หน้าร้าน" : "Delivery")
                     : (String(r.category||"") || "ค่าใช้จ่าย");
  const note  = String(r.note||"").trim();
  const id    = String(r.id||"").replace(/'/g, "\\'");
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px dashed var(--line)">'
    + '<div style="min-width:0">'
    +   '<div style="font-weight:700"><span class="dept-tag">' + DEPT_LABEL[r.dept] + '</span>' + escapeHtml(label) + '</div>'
    +   (note ? '<div class="mini">' + escapeHtml(note) + '</div>' : "")
    + '</div>'
    + '<div style="display:flex;align-items:center;gap:7px;flex:none">'
    +   '<span style="font-weight:800;font-variant-numeric:tabular-nums;color:' + (isIn ? "var(--green)" : "var(--red)") + '">'
    +     (isIn ? "+" : "−") + fmtB(r.amount) + ' ฿</span>'
    +   '<button class="btn-sm danger" title="ลบ" onclick="delRec(&#39;' + (isIn ? "income" : "expense") + '&#39;,&#39;' + id + '&#39;)">✕</button>'
    + '</div></div>';
}



async function delRec(kind, id){
  if(!confirm("ลบรายการนี้?")) return;
  try{
    const r = await apiCall("deleteRec", { kind:kind, id:id });
    if(r.error) throw new Error(r.error);
    showToast("ลบแล้ว");
    await refresh(true);
  }catch(e){ showToast("ลบไม่สำเร็จ: "+e.message); }
}

function todayCard(){
  const day = todayStr();
  const S = { bar:0, bakery:0 }, X = { bar:0, bakery:0 };
  const est = [];
  ["bar","bakery"].forEach(function(dp){
    const x = state.data[dp];
    if(!x) return;
    (x.income || []).forEach(function(r){
      if(normDate(r.date) === day) S[dp] += n2(r.amount);
    });
    (x.expense || []).forEach(function(r){
      if(normDate(r.date) !== day) return;
      X[dp] += n2(r.amount);
      if(String(r.note || "").indexOf("ประเมิน") === 0) est.push(r);
    });
  });
  const sales  = S.bar + S.bakery;
  const spend  = X.bar + X.bakery;
  const profit = sales - spend;

  const line = function(label, val, cls, sub){
    return '<div class="t-row' + (sub ? " t-sub" : "") + '"><span>' + label + '</span>'
         + '<b' + (cls ? ' class="' + cls + '"' : "") + '>' + val + '</b></div>';
  };
  const money = function(v){ return v ? fmtB(v) : "0"; };

  const estBlock = est.map(function(r){
    const pid = String(r.id || "").indexOf("P-") === 0 ? String(r.id).slice(2) : "";
    const txt = String(r.note || "").replace(/^ประเมิน · /, "");
    return '<div class="t-est"' + (pid ? ' onclick="openEstFix(&#39;' + pid + '&#39;,' + n2(r.amount) + ')"' : "") + '>'
         + escapeHtml(txt) + ' · คิดที่ราคามาตรฐาน ' + fmtB(r.amount)
         + (pid ? ' · <u>แตะแก้</u>' : "") + '</div>';
  }).join("");

  return '<div class="card today-hero">'
    + '<p class="t-lab">ยอดขายวันนี้</p>'
    + '<p class="t-big">' + fmtB(sales) + '</p>'
    + '<div class="t-list">'
    +   line("ขาย · บาร์น้ำ",     money(S.bar),    "", true)
    +   line("ขาย · เบเกอรี่",    money(S.bakery), "", true)
    +   line("ซื้อของ · บาร์น้ำ",  (X.bar    ? "−" + fmtB(X.bar)    : "0"), "neg", true)
    +   line("ซื้อของ · เบเกอรี่", (X.bakery ? "−" + fmtB(X.bakery) : "0"), "neg", true)
    +   line("กำไรวันนี้", (profit >= 0 ? "+" : "−") + fmtB(Math.abs(profit)), profit >= 0 ? "pos" : "neg")
    + '</div>'
    + estBlock
    + '</div>';
}

/** ย่อรูปก่อนส่ง — รูปจากมือถือใบนึง 10-14MB ส่งตรงๆ ใช้เวลา 40 วิ
 *  ย่อเหลือด้านยาว 1600px แล้วเหลือหลักแสนไบต์ อ่านบิลได้ชัดเท่าเดิม */
function shrinkImage(file, maxEdge, quality){
  return new Promise(function(resolve, reject){
    const readRaw = function(){
      const rd = new FileReader();
      rd.onload = function(){ resolve(String(rd.result)); };
      rd.onerror = function(){ reject(new Error("อ่านไฟล์ไม่ได้")); };
      rd.readAsDataURL(file);
    };
    if(!/^image\//.test(file.type)) return readRaw();   // pdf ส่งตามเดิม
    const url = URL.createObjectURL(file);
    const im  = new Image();
    im.onload = function(){
      try{
        const scale = Math.min(1, maxEdge / Math.max(im.width, im.height));
        const w = Math.max(1, Math.round(im.width  * scale));
        const h = Math.max(1, Math.round(im.height * scale));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
        g.drawImage(im, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", quality));
      }catch(e){ URL.revokeObjectURL(url); readRaw(); }
    };
    im.onerror = function(){ URL.revokeObjectURL(url); readRaw(); };
    im.src = url;
  });
}

async function onReceiptFile(input){
  const files = input.files ? Array.prototype.slice.call(input.files) : [];
  if(!files.length) return;
  rcBusy = true; rcDone = 0; rcTotal = files.length; render();
  try{
    // ส่งพร้อมกันทุกใบ เพราะย่อแล้วเล็ก ไม่ต้องรอทีละใบ
    const jobs = files.map(function(f){
      return shrinkImage(f, 1600, 0.72).then(function(b64){
        const type = /pdf/i.test(f.type) ? "pdf" : "jpg";
        return apiCall("uploadBill", { date: todayStr(), fileType: type, fileData: b64, source: "staff" });
      }).then(function(r){
        if(r && r.error) throw new Error(r.error);
        rcDone++; render();
        return r;
      });
    });
    const out = await Promise.allSettled(jobs);
    const ok  = out.filter(function(x){ return x.status === "fulfilled"; }).length;
    const bad = out.length - ok;
    state.justShot = files.filter(function(f){ return /^image\//.test(f.type); });
    if(ok && !bad)      showToast(ok > 1 ? ("ส่งแล้ว " + ok + " รูป") : "ส่งบิลแล้ว");
    else if(ok && bad)  showToast("ส่งได้ " + ok + " รูป · ไม่ผ่าน " + bad + " ลองใหม่อีกที");
    else                showToast("ส่งไม่สำเร็จ ลองใหม่อีกที");
    await refresh(true);
  }catch(e){
    showToast("ส่งไม่สำเร็จ: " + e.message);
    refresh(true);
  }
  finally{ rcBusy = false; rcDone = 0; rcTotal = 0; render(); }
}

function canSaveToPhone(){
  const fs = state.justShot || [];
  if(!fs.length) return false;
  try{ return !!(navigator.canShare && navigator.canShare({ files: fs })); }
  catch(e){ return false; }
}

async function saveShotToPhone(){
  const fs = state.justShot || [];
  if(!fs.length) return;
  try{
    await navigator.share({ files: fs, title: "บิล Rush Hour" });
    state.justShot = [];
    render();
  }catch(e){ /* ผู้ใช้กดยกเลิก ไม่ต้องทำอะไร */ }
}
