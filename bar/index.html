<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ย้ายไปแอปใหม่แล้ว · Rush Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1A1814;--ink-3:#8A8378;--line:#E7E2D6;--bg:#FBFAF6;
        --accent:#E5C46A;--accent-deep:#A8801A;--accent-soft:#FBF4DF}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"IBM Plex Sans Thai","Sukhumvit Set","Thonburi",-apple-system,sans-serif;
       background:var(--bg);color:var(--ink);display:grid;place-items:center;
       padding:28px;-webkit-font-smoothing:antialiased}
  .card{max-width:380px;width:100%;text-align:center}
  .mark{font-size:15px;font-weight:700;letter-spacing:.16em;margin-bottom:26px}
  .mark span{color:var(--accent-deep)}
  .ic{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);
      display:grid;place-items:center;margin:0 auto 18px}
  h1{font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
  p{color:#4A443C;font-size:14.5px;line-height:1.65;margin-top:10px}
  .btn{display:block;margin-top:22px;padding:15px 20px;border-radius:14px;
       background:var(--accent);color:var(--ink);font-weight:700;font-size:16px;
       text-decoration:none}
  .btn:active{opacity:.85}
  .mini{font-size:12.5px;color:var(--ink-3);margin-top:14px}
  .hr{height:1px;background:var(--line);margin:22px 0 0}
</style>
</head>
<body>
<div class="card">
  <div class="mark">RUSH<span>·</span>COFFEE</div>
  <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A8801A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <h1>ย้ายไปแอปใหม่แล้ว</h1>
  <p>บาร์น้ำ เบเกอรี่ และสรุปยอด รวมอยู่ในแอปเดียวแล้ว<br>หน้านี้เลิกใช้ ถ้ากรอกที่นี่ข้อมูลจะไม่เข้าระบบ</p>
  <a class="btn" href="../rush/">เปิดแอปใหม่</a>
  <p class="mini">กำลังพาไปให้เอง ใน <span id="c">5</span> วินาที</p>
  <div class="hr"></div>
  <p class="mini">ถ้าเคยติดตั้งไอคอนแอปเก่าไว้บนมือถือ ลบทิ้งได้เลย แล้วติดตั้งใหม่จากแอปใหม่</p>
</div>
<script>
(function(){
  try{
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
      }).catch(function(){});
    }
    if(window.caches && caches.keys){
      caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
    }
  }catch(e){}
  var n = 5, el = document.getElementById("c");
  var t = setInterval(function(){
    n--; if(el) el.textContent = n;
    if(n <= 0){ clearInterval(t); location.replace("../rush/"); }
  }, 1000);
})();
</script>
</body>
</html>
