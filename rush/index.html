<meta name="theme-color" content="#FBFAF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rush">
<style>
  :root{
    --bg:#FBFAF6;
    --surface:#FFFFFF;
    --surface-2:#F7F5EE;
    --line:#E9E5DA;
    --line-strong:#D8D3C4;

    --ink:#1A1814;
    --ink-2:#5C574C;
    --ink-3:#8E8878;

    /* เหลืองมัสตาร์ดอ่อน */
    --accent:#E5C46A;
    --accent-deep:#A8801A;
    --accent-soft:#FBF4DF;
    --on-accent:#2B2311;

    --green:#2F7A4F;  --green-bg:#EAF3EC;
    --red:#B0452C;    --red-bg:#FBEDE9;
    --amber:#96690D;  --amber-bg:#FBF3E0;

    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(26,24,20,.05);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans Thai","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px; line-height:1.55;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{ font-family:inherit; font-size:16px; color:inherit; }
  input,select,textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line-strong);
    border-radius:var(--radius-sm); background:var(--surface); outline:none;
  }
  input:focus,select:focus,textarea:focus{ border-color:var(--accent-deep); }
  h1,h2,h3{ margin:0; font-weight:800; letter-spacing:-.01em; }

  /* ---------- app bar ---------- */
  .appbar{
    position:sticky; top:0; z-index:50;
    background:rgba(251,250,246,.92); backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .appbar-inner{
    display:flex; align-items:center; gap:12px;
    max-width:560px; margin:0 auto; padding:10px 16px;
  }
  .brand{ display:flex; align-items:center; gap:9px; flex:1; min-width:0; }
  .wordmark-img{ height:16px; width:auto; display:block; }
  .wm-app{
    font-size:11px; font-weight:700; letter-spacing:.16em;
    color:var(--ink-3); white-space:nowrap;
  }
  .clock{ text-align:right; line-height:1.2; }
  .clock .t{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
  .clock .d{ font-size:11px; color:var(--ink-3); }

  /* ---------- layout ---------- */
  .wrap{ max-width:560px; margin:0 auto; padding:14px 16px 8px; }
  .sub{ margin:0 0 12px; font-size:13px; color:var(--ink-3); }

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; margin-bottom:12px;
  }

  /* ---------- chips ---------- */
  .chiprow{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{
    padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-2); font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  /* ---------- buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; border-radius:var(--radius-sm);
    border:1px solid var(--line-strong); background:var(--surface);
    font-weight:650; cursor:pointer;
  }
  .btn-primary{ background:var(--ink); border-color:var(--ink); color:#fff; font-weight:700; }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700; }
  .btn-sm{
    width:auto; padding:8px 12px; font-size:13px; border-radius:9px;
    border:1px solid var(--line-strong); background:var(--surface); cursor:pointer; font-weight:650;
  }
  .btn-sm.solid{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .btn-sm.danger{ color:var(--red); border-color:#E8D2CB; }

  /* ---------- kpi ---------- */
  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 12px; }
  .kpi{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:12px 14px;
  }
  .kpi.wide{ grid-column:1 / -1; }
  .kpi-label{ margin:0 0 2px; font-size:11.5px; color:var(--ink-3); }
  .kpi-val{ margin:0; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
  .kpi.warn{ border-left:3px solid var(--amber); }
  .kpi.bad { border-left:3px solid var(--red); }
  .kpi.warn .kpi-val{ color:var(--amber); font-size:28px; }
  .kpi.bad  .kpi-val{ color:var(--red);   font-size:28px; }
  .pos{ color:var(--green); } .neg{ color:var(--red); }

  /* ---------- rows ---------- */
  .row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:7px 0; gap:12px;
  }
  .row + .row{ border-top:1px dashed var(--line); }
  .row .k{ font-size:13px; color:var(--ink-2); }
  .row .v{ font-weight:700; font-variant-numeric:tabular-nums; }

  .it-row{
    background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:12px 13px; margin-bottom:8px;
  }
  .it-row.low{ border-left:3px solid var(--amber); }
  .it-row.out{ border-left:3px solid var(--red); }
  .it-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .it-name{ font-weight:700; }
  .it-qty{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .mini{ font-size:12px; color:var(--ink-3); }
  .acts{ display:flex; gap:6px; justify-content:flex-end; margin-top:9px; }

  .gauge{ height:5px; border-radius:3px; background:#EFEDE5; overflow:hidden; margin:8px 0 4px; }
  .gauge > span{ display:block; height:100%; background:var(--ink-3); }

  /* ---------- table (summary) ---------- */
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th,.tbl td{ padding:8px 6px; text-align:right; white-space:nowrap; }
  .tbl th{ color:var(--ink-3); font-weight:600; font-size:11.5px; border-bottom:1px solid var(--line); }
  .tbl td{ border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .tbl th:first-child,.tbl td:first-child{ text-align:left; }
  .tbl tfoot td{ font-weight:800; border-top:2px solid var(--line-strong); border-bottom:none; }
  .scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -14px; padding:0 14px; }

  /* ---------- empty / loading ---------- */
  .empty{ text-align:center; color:var(--ink-3); padding:44px 16px; }
  .empty .big{ display:block; font-size:30px; margin-bottom:8px; opacity:.6; }
  .skel{ height:74px; border-radius:12px; background:linear-gradient(90deg,#F1EEE6,#F7F5EF,#F1EEE6);
         background-size:200% 100%; animation:sk 1.2s infinite; margin-bottom:8px; }
  @keyframes sk{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ---------- modal sheet ---------- */
  .overlay{
    position:fixed; inset:0; z-index:200; background:rgba(26,24,20,.34);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    background:var(--surface); border-radius:20px 20px 0 0;
    padding:8px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .grab{ width:38px; height:4px; border-radius:2px; background:var(--line-strong); margin:6px auto 14px; }
  .lbl{ display:block; font-size:12.5px; color:var(--ink-2); margin:10px 0 5px; font-weight:600; }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(96px + env(safe-area-inset-bottom)); z-index:300;
    background:var(--ink); color:#fff; padding:11px 17px; border-radius:11px;
    font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:.2s;
    max-width:88vw; text-align:center;
  }
  #toast.show{ opacity:1; }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:rgba(255,255,255,.96); backdrop-filter:saturate(1.4) blur(12px);
    border-top:1px solid var(--line);
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  }
  .nav-inner{ display:flex; max-width:560px; margin:0 auto; gap:4px; }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:7px 2px; border:none; background:none; cursor:pointer;
    color:var(--ink-3); font-size:10.5px; font-weight:700; position:relative;
  }
  .nav-item svg{ width:22px; height:22px; }
  .nav-item.active{ color:var(--ink); }
  .nav-item.active::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:2px;
    width:20px; height:2.5px; border-radius:2px; background:var(--accent-deep);
  }

  /* ---------- print (PDF) ---------- */
  @media print{
    .appbar,.bottom-nav,.no-print,#toast{ display:none !important; }
    body{ padding:0; background:#fff; }
    .wrap{ max-width:none; padding:0; }
    .card{ border:none; padding:0; }
    .tbl{ font-size:11px; }
    .scroll-x{ overflow:visible; margin:0; padding:0; }
    @page{ margin:14mm; }
  }
</style>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c0-4 3.6-7 8-7s8 3 8 7"/><path d="M3 14h18v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3Z"/><path d="M8.5 10.5 10 7M12 10.2 12 7M15.5 10.5 14 7"/></svg>
      เบเกอรี่
    </button>
  </div>
</nav>

<script>
/* =========================================================
   Rush Coffee — แอปรวม
   หมวด 1 สรุปรวม (อ่านอย่างเดียว + PDF + ตอกบัตร)
   หมวด 2 บาร์น้ำ / หมวด 3 เบเกอรี่  (สต๊อก · บันทึกรายวัน · ต้นทุน)
   ยอดของหมวด 2-3 ไหลเข้าหมวด 1 เองเพราะเขียนลงชีตเดียวกัน
   ========================================================= */

const API_URL = "https://script.google.com/macros/s/AKfycbwpQ2EmK5kFVAjvN4gp2ZluMdKYq8ETnAa7p6_H1QRz9R_LFeEoJh03VfB-u0Lat-Mt/exec";
const ATTEND_URL = "../staff/?embed=1";

const DEPT_LABEL = { bar:"บาร์น้ำ", bakery:"เบเกอรี่" };

const state = {
  section: "summary",          // summary | bar | bakery
  tab: "daily",                // stock | daily | cost   (ในหมวดแผนก)
  subTab: "sales",             // sales | attend         (ในหมวดสรุป)
  period: "month",             // day | week | month | custom
  rangeFrom: "", rangeTo: "",
  cat: "all", q: "",
  formOpen:false, loaded:false,
  data: { bar:null, bakery:null },   // bootstrap ต่อแผนก
  roll: null                          // rollup สำหรับหมวดสรุป
};

/* ---------------- helpers ---------------- */
function n2(v){ const n = parseFloat(String(v==null?"":v).replace(/[, ]/g,"")); return isNaN(n)?0:n; }
function fmtN(v){ const n=n2(v); return (Math.round(n*100)/100).toLocaleString("en-US"); }
function fmtB(v){ return fmtN(v); }
function pad2(n){ return n<10?"0"+n:""+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function normDate(v){ return String(v==null?"":v).slice(0,10); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

const TH_MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function thDate(iso){
  const p = String(iso||"").slice(0,10).split("-");
  if(p.length<3) return String(iso||"");
  return parseInt(p[2],10) + " " + TH_MON[parseInt(p[1],10)-1];
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__tt); window.__tt=setTimeout(function(){ t.classList.remove("show"); },2600);
}

function tickClock(){
  const d=new Date();
  document.getElementById("clockT").textContent = pad2(d.getHours())+":"+pad2(d.getMinutes());
  const wd=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"][d.getDay()];
  document.getElementById("clockD").textContent = wd+" "+pad2(d.getDate())+" "+TH_MON[d.getMonth()];
}

async function apiCall(action, payload){
  const body = "action="+encodeURIComponent(action)+"&payload="+encodeURIComponent(JSON.stringify(payload||{}));
  const res = await fetch(API_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: body
  });
  const text = await res.text();
  if(!res.ok) throw new Error("เซิร์ฟเวอร์ตอบกลับ HTTP "+res.status);
  try{ return JSON.parse(text); }
  catch(e){ throw new Error("รูปแบบข้อมูลไม่ถูกต้อง: "+text.slice(0,120)); }
}

/* ---------------- data ---------------- */

function cacheKey(){ return "rushBoot"; }

function saveCache(){
  try{
    localStorage.setItem(cacheKey(), JSON.stringify({
      d: todayStr(), data: state.data, roll: state.roll
    }));
  }catch(e){}
}

function bootFromCache(){
  try{
    const c = JSON.parse(localStorage.getItem(cacheKey()) || "null");
    if(c && c.d === todayStr() && c.data){
      state.data = c.data; state.roll = c.roll || null; state.loaded = true;
      render();
      return true;
    }
  }catch(e){}
  return false;
}

function showError(msg){
  document.getElementById("errorBox").innerHTML = msg
    ? '<div class="card" style="background:var(--red-bg);border-color:#EED9D2;color:#7A2C1B;font-size:12.5px;line-height:1.5">'
      + escapeHtml(String(msg).slice(0,220)) + '</div>'
    : "";
}

async function loadDept(dept, force){
  if(state.data[dept] && !force) return state.data[dept];
  const b = await apiCall("bootstrap", { dept: dept, date: todayStr() });
  if(b.error) throw new Error(b.error);
  state.data[dept] = {
    items:  (b.items||[]).map(function(it){ return Object.assign({}, it, {
              qty:n2(it.qty), min:n2(it.min), cost:n2(it.cost) }); }),
    income: (b.income||[]).map(function(r){ return Object.assign({}, r, {
              amount:n2(r.amount), date:normDate(r.date) }); }),
    expense:(b.expense||[]).map(function(r){ return Object.assign({}, r, {
              amount:n2(r.amount), date:normDate(r.date) }); }),
    recipes:(b.recipes||[]).map(function(r){ return Object.assign({}, r, {
              sellingPrice:n2(r.sellingPrice), servings:n2(r.servings),
              ingredientQty:n2(r.ingredientQty), buyPrice:n2(r.buyPrice),
              packSize:n2(r.packSize) }); }),
    purchases:(b.purchases||[]).map(function(r){ return Object.assign({}, r, {
              amount:n2(r.amount), date:normDate(r.date) }); }),
    summary: b.summary || null
  };
  return state.data[dept];
}

async function loadRollup(force){
  if(state.roll && !force) return state.roll;
  const r = periodRange();
  const out = await apiCall("rollup", { from:r.from, to:r.to });
  if(out.error) throw new Error(out.error);
  state.roll = out;
  return out;
}

async function refresh(force){
  showError("");
  try{
    if(state.section === "summary"){
      await loadDept("bar", !!force);
      await loadDept("bakery", !!force);
      state.roll = computeRoll();
    }else{
      await loadDept(state.section, !!force);
    }
    state.loaded = true;
    saveCache();
    render();
  }catch(e){
    showError("เชื่อมต่อข้อมูลไม่สำเร็จ: " + e.message);
    render();
  }
}

/* ---------------- period ---------------- */

function cycleIndex(day){ return day<=5?0:day<=10?1:day<=15?2:day<=20?3:day<=25?4:5; }

function computeRoll(){
  const r = periodRange();
  const days = {};
  const slot = function(d){
    if(!days[d]) days[d] = { date:d, bar:{sales:0,expense:0,delivery:0}, bakery:{sales:0,expense:0,delivery:0} };
    return days[d];
  };
  ["bar","bakery"].forEach(function(dp){
    const d = state.data[dp]; if(!d) return;
    (d.income||[]).forEach(function(x){
      const dt = normDate(x.date); if(dt<r.from || dt>r.to) return;
      slot(dt)[dp].sales += n2(x.amount);
      if(String(x.channel||"")==="delivery") slot(dt)[dp].delivery += n2(x.amount);
    });
    (d.expense||[]).forEach(function(x){
      const dt = normDate(x.date); if(dt<r.from || dt>r.to) return;
      slot(dt)[dp].expense += n2(x.amount);
    });
  });
  const list = Object.keys(days).sort().map(function(k){
    const x = days[k];
    const sales = x.bar.sales + x.bakery.sales;
    const expense = x.bar.expense + x.bakery.expense;
    return { date:k, barSales:x.bar.sales, barExpense:x.bar.expense,
             bakerySales:x.bakery.sales, bakeryExpense:x.bakery.expense,
             barDelivery:x.bar.delivery, bakeryDelivery:x.bakery.delivery,
             delivery:x.bar.delivery + x.bakery.delivery,
             sales:sales, expense:expense, profit:sales-expense };
  });
  const totals = list.reduce(function(a,x){
    a.barSales+=x.barSales; a.barExpense+=x.barExpense;
    a.bakerySales+=x.bakerySales; a.bakeryExpense+=x.bakeryExpense;
    a.delivery+=x.delivery; a.sales+=x.sales; a.expense+=x.expense; a.profit+=x.profit;
    return a;
  }, {barSales:0,barExpense:0,bakerySales:0,bakeryExpense:0,delivery:0,sales:0,expense:0,profit:0});

  // รอบจ่ายเดลิเวอรี่ 5 วัน ของเดือนปัจจุบัน
  const ym = todayStr().slice(0,8);
  const p2 = function(n){ return (n<10?"0":"")+n; };
  const bounds = [[1,5],[6,10],[11,15],[16,20],[21,25],[26,31]];
  const cycles = bounds.map(function(c){
    return { from: ym+p2(c[0]), to: ym+p2(c[1]), bar:0, bakery:0, total:0 };
  });
  ["bar","bakery"].forEach(function(dp){
    const d = state.data[dp]; if(!d) return;
    (d.income||[]).forEach(function(x){
      if(String(x.channel||"")!=="delivery") return;
      const dt = normDate(x.date); if(dt.slice(0,8)!==ym) return;
      const i = cycleIndex(parseInt(dt.slice(8,10),10));
      cycles[i][dp] += n2(x.amount); cycles[i].total += n2(x.amount);
    });
  });
  return { from:r.from, to:r.to, days:list, totals:totals, cycles:cycles };
}

function periodRange(){
  const today = todayStr();
  if(state.period === "day")   return { from: today, to: today };
  if(state.period === "week"){
    const d = new Date(); d.setDate(d.getDate()-6);
    return { from: d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()), to: today };
  }
  if(state.period === "custom"){
    return { from: state.rangeFrom || today.slice(0,8)+"01", to: state.rangeTo || today };
  }
  return { from: today.slice(0,8)+"01", to: today };   // month
}

function periodLabel(){
  const r = periodRange();
  if(state.period==="day") return "วันนี้";
  if(state.period==="week") return "7 วันล่าสุด";
  if(state.period==="month") return "เดือนนี้";
  return thDate(r.from) + " – " + thDate(r.to);
}

function inPeriod(dateStr){
  const r = periodRange(); const d = normDate(dateStr);
  return d >= r.from && d <= r.to;
}

function periodChips(){
  const opts = [["day","วันนี้"],["week","7 วัน"],["month","เดือนนี้"],["custom","กำหนดเอง"]];
  return '<div class="chiprow no-print">'
    + opts.map(function(o){
        return '<button class="chip '+(state.period===o[0]?"active":"")
             + '" onclick="setPeriod(\''+o[0]+'\')">'+o[1]+'</button>';
      }).join("")
    + '</div>'
    + (state.period==="custom" ? rangeFields() : "");
}

function rangeFields(){
  const r = periodRange();
  return '<div class="card no-print" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px">'
    + '<div><label class="lbl" style="margin-top:0">ตั้งแต่</label>'
    +   '<input type="date" value="'+r.from+'" onchange="state.rangeFrom=this.value;refresh(true)"></div>'
    + '<div><label class="lbl" style="margin-top:0">ถึง</label>'
    +   '<input type="date" value="'+r.to+'" onchange="state.rangeTo=this.value;refresh(true)"></div>'
    + '</div>';
}

function setPeriod(p){
  state.period = p;
  if(p==="custom" && !state.rangeFrom){
    const t=todayStr(); state.rangeFrom=t.slice(0,8)+"01"; state.rangeTo=t;
  }
  if(state.section==="summary"){ state.roll = computeRoll(); render(); } else render();
}

/* ---------------- navigation ---------------- */

function setSection(s){
  state.section = s;
  state.tab = (s==="summary") ? "daily" : "daily";
  state.subTab = "sales";
  [["summary","navSummary"],["bar","navBar"],["bakery","navBakery"]].forEach(function(p){
    const el=document.getElementById(p[1]); if(el) el.classList.toggle("active", s===p[0]);
  });
  document.getElementById("sectionTag").textContent =
    s==="summary" ? "สรุปรวม" : DEPT_LABEL[s];
  window.scrollTo(0,0);
  render();
  refresh(false);
}

function setTab(t){ state.tab = t; window.scrollTo(0,0); render(); }
function setSubTab(t){ state.subTab = t; window.scrollTo(0,0); render(); }
function setCat(c){ state.cat = c; render(); }
function onSearch(v){ state.q = String(v||"").trim().toLowerCase(); render(); }

/* ---------------- render dispatch ---------------- */

function render(){
  const title = document.getElementById("pageTitle");
  const sub   = document.getElementById("pageSub");
  const box   = document.getElementById("content");

  if(state.section === "summary"){
    title.textContent = "สรุปรวม";
    sub.textContent = state.loaded ? "ทุกยอดของบาร์น้ำและเบเกอรี่ รวมกันอัตโนมัติ" : "กำลังโหลดข้อมูล…";
    box.innerHTML = state.subTab==="attend" ? renderAttend() : renderSummary();
    return;
  }

  const d = state.data[state.section];
  title.textContent = DEPT_LABEL[state.section];
  if(!d){ sub.textContent="กำลังโหลดข้อมูล…"; box.innerHTML = skeleton(); return; }

  if(state.tab === "stock"){
    sub.textContent = stockSubtitle(d);
    box.innerHTML = deptTabs() + renderStock(d);
  }else if(state.tab === "cost"){
    sub.textContent = "ต้นทุนและกำไรขั้นต้นของเมนู";
    box.innerHTML = deptTabs() + renderCost(d);
  }else{
    sub.textContent = "ยอดขายและค่าใช้จ่าย";
    box.innerHTML = deptTabs() + renderDaily(d);
  }
}

function skeleton(){ return '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; }

function deptTabs(){
  const opts=[["daily","บันทึกรายวัน"],["stock","สต๊อก"],["cost","ต้นทุน"]];
  return '<div class="chiprow no-print">'
    + opts.map(function(o){
        return '<button class="chip '+(state.tab===o[0]?"active":"")
             + '" onclick="setTab(\''+o[0]+'\')">'+o[1]+'</button>';
      }).join("")
    + '</div>';
}

/* =======================================================
   หมวด 1 — สรุปรวม
   ======================================================= */

function summaryTabs(){
  const opts=[["sales","สรุปยอด"],["attend","ตอกบัตร"]];
  return '<div class="chiprow no-print">'
    + opts.map(function(o){
        return '<button class="chip '+(state.subTab===o[0]?"active":"")
             + '" onclick="setSubTab(\''+o[0]+'\')">'+o[1]+'</button>';
      }).join("")
    + '</div>';
}

function renderSummary(){
  const head = summaryTabs() + periodChips();
  const roll = state.roll;
  if(!roll) return head + skeleton();

  const t = roll.totals || {};
  const days = roll.days || [];
  const profit = n2(t.profit);

  const kpis =
      '<div class="kpi-grid">'
    +   '<div class="kpi wide"><p class="kpi-label">กำไร · '+escapeHtml(periodLabel())+'</p>'
    +     '<p class="kpi-val '+(profit>=0?"pos":"neg")+'">'+(profit>=0?"+":"−")+fmtB(Math.abs(profit))+' ฿</p></div>'
    +   '<div class="kpi"><p class="kpi-label">ยอดขายรวม</p><p class="kpi-val">'+fmtB(t.sales)+'</p></div>'
    +   '<div class="kpi"><p class="kpi-label">ค่าใช้จ่ายรวม</p><p class="kpi-val" style="color:var(--red)">'+fmtB(t.expense)+'</p></div>'
    + '</div>';

  const split =
      '<div class="card">'
    +   '<div style="font-weight:800;font-size:14px;margin-bottom:6px">แยกตามหมวด</div>'
    +   deptSplitRow("บาร์น้ำ",  t.barSales,    t.barExpense)
    +   deptSplitRow("เบเกอรี่", t.bakerySales, t.bakeryExpense)
    + '</div>';

  let table;
  if(!days.length){
    table = '<div class="empty"><span class="big">◔</span>ยังไม่มีรายการในช่วงนี้</div>';
  }else{
    table =
      '<div class="card"><div style="font-weight:800;font-size:14px;margin-bottom:8px">รายวัน</div>'
      + '<div class="scroll-x"><table class="tbl">'
      + '<thead><tr><th>วันที่</th><th>บาร์น้ำ</th><th>เบเกอรี่</th><th>ขายรวม</th><th>Delivery</th><th>จ่าย</th><th>กำไร</th></tr></thead><tbody>'
      + days.slice().reverse().map(function(d){
          const p = n2(d.profit);
          return '<tr>'
            + '<td>'+thDate(d.date)+'</td>'
            + '<td>'+fmtB(d.barSales)+'</td>'
            + '<td>'+fmtB(d.bakerySales)+'</td>'
            + '<td><b>'+fmtB(d.sales)+'</b></td>'
            + '<td style="color:var(--accent-deep)">'+(n2(d.delivery)?fmtB(d.delivery):'—')+'</td>'
            + '<td style="color:var(--red)">'+(n2(d.expense)?"−"+fmtB(d.expense):"—")+'</td>'
            + '<td class="'+(p>=0?"pos":"neg")+'"><b>'+(p>=0?"+":"−")+fmtB(Math.abs(p))+'</b></td>'
            + '</tr>';
        }).join("")
      + '</tbody><tfoot><tr>'
      + '<td>รวม</td><td>'+fmtB(t.barSales)+'</td><td>'+fmtB(t.bakerySales)+'</td>'
      + '<td>'+fmtB(t.sales)+'</td>'
      + '<td style="color:var(--accent-deep)">'+fmtB(t.delivery)+'</td>'
      + '<td style="color:var(--red)">−'+fmtB(t.expense)+'</td>'
      + '<td class="'+(profit>=0?"pos":"neg")+'">'+(profit>=0?"+":"−")+fmtB(Math.abs(profit))+'</td>'
      + '</tr></tfoot></table></div></div>';
  }

  const pdfBtn = '<button class="btn btn-accent no-print" onclick="downloadPDF()" style="margin-bottom:14px">'
    + '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>'
    + 'ดาวน์โหลด PDF</button>';

  return head + printHeader() + kpis + split + deliveryCard() + table + pdfBtn;
}


function currentCycle(){
  return cycleIndex(parseInt(todayStr().slice(8,10),10));
}

function cycleLabel(c){
  const a = parseInt(c.from.slice(8,10),10);
  let b = parseInt(c.to.slice(8,10),10);
  const last = new Date(parseInt(c.to.slice(0,4),10), parseInt(c.to.slice(5,7),10), 0).getDate();
  if(b > last) b = last;
  return a + "–" + b + " " + TH_MON[parseInt(c.to.slice(5,7),10)-1];
}

function deliveryCard(){
  const roll = state.roll;
  if(!roll || !roll.cycles) return "";
  const cur = currentCycle();
  const c = roll.cycles[cur];
  const monthTotal = roll.cycles.reduce(function(a,x){ return a + n2(x.total); }, 0);

  const line = function(x, i){
    const now = i === cur;
    return '<div class="row" style="' + (now ? 'background:var(--accent-soft);margin:0 -14px;padding:8px 14px' : '') + '">'
      + '<span class="k" style="' + (now ? 'font-weight:700;color:var(--ink)' : '') + '">'
      +   cycleLabel(x) + (now ? ' <span style="font-size:11px;color:var(--accent-deep)">· รอบนี้</span>' : '')
      + '</span>'
      + '<span class="v" style="font-size:14px">'
      +   (n2(x.total)
          ? ('<span style="font-size:11.5px;color:var(--ink-3);font-weight:500">'
             + fmtB(x.bar) + ' + ' + fmtB(x.bakery) + ' · </span>' + fmtB(x.total))
          : '<span style="color:var(--ink-3);font-weight:500">—</span>')
      + '</span></div>';
  };

  return '<div class="card">'
    + '<div style="font-weight:800;font-size:15px;margin-bottom:2px">Delivery · รอบ 5 วัน</div>'
    + '<div class="mini" style="margin-bottom:10px">สรุปลง Drive ทุกวันที่ 1 · 6 · 11 · 16 · 21 · 26</div>'
    + '<div style="font-size:11.5px;color:var(--ink-3)">รอบนี้ ' + cycleLabel(c) + '</div>'
    + '<div style="font-size:28px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums">'
    +   fmtB(c.total) + ' <span style="font-size:15px;color:var(--ink-3)">฿</span></div>'
    + '<div class="mini" style="margin-bottom:10px">บาร์น้ำ ' + fmtB(c.bar) + ' · เบเกอรี่ ' + fmtB(c.bakery) + '</div>'
    + '<div style="border-top:1px dashed var(--line);padding-top:4px">'
    +   roll.cycles.map(line).join('')
    + '</div>'
    + '<div class="row" style="border-top:2px solid var(--line-strong);margin-top:2px">'
    +   '<span class="k" style="font-weight:700;color:var(--ink)">รวมทั้งเดือน</span>'
    +   '<span class="v" style="font-size:16px">' + fmtB(monthTotal) + '</span>'
    + '</div></div>';
}

function deptSplitRow(name, sales, expense){
  const p = n2(sales) - n2(expense);
  return '<div class="row">'
    + '<span class="k">'+name+'</span>'
    + '<span class="v" style="font-weight:600;font-size:13px;color:var(--ink-3)">'
    +   'ขาย '+fmtB(sales)+' · จ่าย '+fmtB(expense)+' · '

/* =======================================================
   หมวด 2-3 — สต๊อก
   ======================================================= */

function deptItems(d){ return d.items || []; }

function lowItems(d){
  return deptItems(d).filter(function(it){ return n2(it.qty) <= n2(it.min); });
}

function stockValue(d){
  return deptItems(d).reduce(function(a,it){ return a + n2(it.qty)*n2(it.cost); }, 0);
}

function stockSubtitle(d){
  const low = lowItems(d).length;
  return low ? (low + " รายการใกล้หมด — ควรสั่งเพิ่ม") : "สต๊อกอยู่ในระดับปกติ";
}

function visibleCats(d){
  const set = {};
  deptItems(d).forEach(function(it){ const c=String(it.category||"").trim(); if(c) set[c]=1; });
  return Object.keys(set).sort();
}

function renderStock(d){
  const items = deptItems(d);
  const out   = items.filter(function(it){ return n2(it.qty) <= 0; }).length;
  const low   = lowItems(d).length;

  const kpis =
      '<div class="kpi-grid">'
    +   '<div class="kpi"><p class="kpi-label">วัตถุดิบทั้งหมด</p><p class="kpi-val">'+items.length+'</p></div>'
    +   '<div class="kpi warn"><p class="kpi-label">ใกล้หมด</p><p class="kpi-val">'+low+'</p></div>'
    +   '<div class="kpi bad"><p class="kpi-label">หมดสต๊อก</p><p class="kpi-val">'+out+'</p></div>'
    +   '<div class="kpi"><p class="kpi-label">มูลค่าคงเหลือ</p><p class="kpi-val">'+fmtB(stockValue(d))+'</p></div>'
    + '</div>';

  const cats = visibleCats(d);
  const chips = '<div class="chiprow">'
    + '<button class="chip '+(state.cat==="all"?"active":"")+'" onclick="setCat(\'all\')">ทั้งหมด</button>'
    + cats.map(function(c){
        return '<button class="chip '+(state.cat===c?"active":"")+'" onclick="setCat(\''+escapeHtml(c).replace(/'/g,"\\'")+'\')">'+escapeHtml(c)+'</button>';
      }).join("")
    + '</div>';

  const search = '<div style="margin-bottom:10px"><input placeholder="ค้นหาวัตถุดิบ…" value="'+escapeHtml(state.q)+'" oninput="onSearch(this.value)"></div>';

  let list = items.filter(function(it){
    if(state.cat!=="all" && String(it.category||"")!==state.cat) return false;
    if(state.q && String(it.name||"").toLowerCase().indexOf(state.q)<0) return false;
    return true;
  });
  list.sort(function(a,b){
    const ra = n2(a.min)>0 ? n2(a.qty)/n2(a.min) : 9;
    const rb = n2(b.min)>0 ? n2(b.qty)/n2(b.min) : 9;
    return ra-rb;
  });

  const rows = list.length
    ? list.map(itemRow).join("")
    : '<div class="empty"><span class="big">◻</span>ยังไม่มีวัตถุดิบ</div>';

  const addBtn = '<button class="btn" onclick="openItemForm()" style="margin:4px 0 14px">+ เพิ่มวัตถุดิบใหม่</button>';

  return kpis + addBtn + search + chips + rows;
}

function itemRow(it){
  const qty=n2(it.qty), min=n2(it.min);
  const cls = qty<=0 ? "out" : (qty<=min ? "low" : "");
  const tag = qty<=0 ? '<span style="color:var(--red);font-size:12px"> · หมด</span>'
            : (qty<=min ? '<span style="color:var(--amber);font-size:12px"> · ใกล้หมด</span>' : "");
  const pct = min>0 ? Math.max(4, Math.min(100, qty/ (min*2) *100)) : 100;
  const id = escapeHtml(String(it.id));
  return '<div class="it-row '+cls+'">'
    + '<div class="it-top"><div class="it-name">'+escapeHtml(it.name)+tag+'</div>'
    +   '<div class="it-qty '+(qty<=0?"neg":"")+'">'+fmtN(qty)+' '+escapeHtml(it.unit||"")+'</div></div>'
    + '<div class="gauge"><span style="width:'+pct+'%"></span></div>'
    + '<div class="mini">ขั้นต่ำ '+fmtN(min)+' '+escapeHtml(it.unit||"")
    +   (n2(it.cost)>0 ? ' · ทุน '+fmtN(it.cost)+'฿/'+escapeHtml(it.unit||"") : ' · ยังไม่ระบุทุน')+'</div>'
    + '<div class="acts">'
    +   '<button class="btn-sm" onclick="openMove(\''+id+'\',\'out\')">ใช้ออก</button>'
    +   '<button class="btn-sm solid" onclick="openMove(\''+id+'\',\'in\')">รับเข้า</button>'
    +   '<button class="btn-sm" onclick="openItemForm(\''+id+'\')">แก้</button>'
    + '</div></div>';
}

function itemById(id){
  const d = state.data[state.section] || {items:[]};
  return (d.items||[]).find(function(x){ return String(x.id)===String(id); });
}

/* =======================================================
   หมวด 2-3 — บันทึกรายวัน
   ======================================================= */

function renderDaily(d){
  const inc = (d.income ||[]).filter(function(r){ return inPeriod(r.date); });
  const exp = (d.expense||[]).filter(function(r){ return inPeriod(r.date); });
  const sales   = inc.reduce(function(a,r){ return a+n2(r.amount); },0);
  const expense = exp.reduce(function(a,r){ return a+n2(r.amount); },0);
  const profit  = sales - expense;

  const store = inc.filter(function(r){ return String(r.channel||"store")==="store"; })
                   .reduce(function(a,r){ return a+n2(r.amount); },0);
  const deli  = sales - store;

  const mStart = todayStr().slice(0,8)+"01";
  const mSales = (d.income ||[]).reduce(function(a,r){ return (normDate(r.date)>=mStart)?a+n2(r.amount):a; },0);
  const mExp   = (d.expense||[]).reduce(function(a,r){ return (normDate(r.date)>=mStart)?a+n2(r.amount):a; },0);

  const kpis =
      '<div class="kpi-grid">'
    +   '<div class="kpi"><p class="kpi-label">ยอดขาย · '+escapeHtml(periodLabel())+'</p><p class="kpi-val">'+fmtB(sales)+'</p></div>'
    +   '<div class="kpi"><p class="kpi-label">ค่าใช้จ่าย</p><p class="kpi-val" style="color:var(--red)">'+fmtB(expense)+'</p></div>'
    +   '<div class="kpi wide"><p class="kpi-label">คงเหลือ</p>'
    +     '<p class="kpi-val '+(profit>=0?"pos":"neg")+'">'+(profit>=0?"+":"−")+fmtB(Math.abs(profit))+' ฿</p></div>'
    +   '<div class="kpi"><p class="kpi-label">หน้าร้าน · '+(sales?Math.round(store/sales*100):0)+'%</p><p class="kpi-val" style="font-size:19px">'+fmtB(store)+'</p></div>'
    +   '<div class="kpi"><p class="kpi-label">Delivery · '+(sales?Math.round(deli/sales*100):0)+'%</p><p class="kpi-val" style="font-size:19px">'+fmtB(deli)+'</p></div>'
    + '</div>';

  const acts =
      '<div style="display:flex;gap:8px;margin-bottom:12px">'
    +   '<button class="btn btn-primary" onclick="openSaleForm()">+ ยอดขาย</button>'
    +   '<button class="btn btn-primary" onclick="openBuyForm()">+ ซื้อของ</button>'
    + '</div>';

  const mtd =
      '<div class="card">'
    +   '<div style="font-weight:800;font-size:14px;margin-bottom:2px">สะสมเดือนนี้</div>'
    +   '<div class="mini" style="margin-bottom:4px">ตั้งแต่ 1 '+TH_MON[parseInt(todayStr().slice(5,7),10)-1]+'</div>'
    +   '<div class="row"><span class="k">ยอดขาย</span><span class="v">'+fmtB(mSales)+'</span></div>'
    +   '<div class="row"><span class="k">ค่าใช้จ่าย</span><span class="v" style="color:var(--red)">−'+fmtB(mExp)+'</span></div>'
    +   '<div class="row"><span class="k">กำไร</span><span class="v '+((mSales-mExp)>=0?"pos":"neg")+'" style="font-size:17px">'
    +     ((mSales-mExp)>=0?"+":"−")+fmtB(Math.abs(mSales-mExp))+'</span></div>'
    + '</div>';

  const recs = inc.map(function(r){ return Object.assign({},r,{kind:"in"}); })
    .concat(exp.map(function(r){ return Object.assign({},r,{kind:"out"}); }))
    .sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });

  const list = recs.length
    ? '<div class="card">'
      + '<div style="font-weight:800;font-size:14px;margin-bottom:6px">รายการที่บันทึก <span class="mini">'+escapeHtml(periodLabel())+'</span></div>'
      + recs.map(recRow).join("")
      + '</div>'
    : '<div class="empty"><span class="big">◔</span>ยังไม่มีรายการในช่วงนี้<br><span class="mini">กดปุ่มด้านบนเพื่อบันทึก</span></div>';

  return periodChips() + receiptCard(d) + kpis + acts + mtd + list;
}

function recRow(r){
  const isIn = r.kind === "in";
  const label = isIn ? (String(r.channel||"store")==="store" ? "หน้าร้าน" : "Delivery")
                     : (String(r.category||"") || "ค่าใช้จ่าย");
  const note = String(r.note||"").trim();
  const id = String(r.id||"").replace(/'/g,"\\'");
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px dashed var(--line)">'
    + '<div style="min-width:0"><div style="font-weight:700">'+escapeHtml(label)+'</div>'
    +   '<div class="mini">'+escapeHtml(r.date)+(note?' · '+escapeHtml(note):"")+'</div></div>'
    + '<div style="display:flex;align-items:center;gap:7px;flex:none">'
    +   '<span style="font-weight:800;font-variant-numeric:tabular-nums;color:'+(isIn?"var(--green)":"var(--red)")+'">'
    +     (isIn?"+":"−")+fmtB(r.amount)+' ฿</span>'
    +   '<button class="btn-sm danger" title="ลบ" onclick="delRec(\''+(isIn?"income":"expense")+'\',\''+id+'\')">✕</button>'
    + '</div></div>';
}

async function delRec(kind, id){
  if(!confirm("ลบรายการนี้?")) return;
  try{
    const r = await apiCall("deleteRec", { kind:kind, id:id });
    if(r.error) throw new Error(r.error);
    showToast("ลบแล้ว");
    await refresh(true);
  }catch(e){ showToast("ลบไม่สำเร็จ: "+e.message); }
}

/* ---------------- ใบเสร็จ ---------------- */

const RC_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M6 3.5h12v17l-2.4-1.6-2.4 1.6-2.4-1.6-2.4 1.6-2.4-1.6V3.5z"/><path d="M9.5 9h5M9.5 13h5"/></svg>';
let rcBusy = false;

function receiptCard(d){
  const rows = (d.purchases||[]).filter(function(r){ return normDate(r.date)===todayStr(); });
  const pending = rows.filter(function(r){ return String(r.status)!=="ok"; }).length;
  const lines = rows.map(function(r){
    const id = String(r.id||"").replace(/'/g,"\\'");
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)">'
      + '<div style="min-width:0"><div style="font-weight:700">'+escapeHtml(r.vendor||"รออ่านยอด")+'</div>'
      +   '<a class="mini" href="'+escapeHtml(r.fileUrl||"#")+'" target="_blank" rel="noopener">ดูรูป</a></div>'
      + '<div style="display:flex;align-items:center;gap:6px">'
      +   '<input inputmode="decimal" value="'+(n2(r.amount)||"")+'" placeholder="ยอด ฿" '
      +     'onchange="setReceiptAmount(\''+id+'\',this.value)" style="width:104px;text-align:right;padding:8px 10px">'
      + '</div></div>';
  }).join("");

  return '<div class="card">'
    + '<button class="btn btn-primary" onclick="pickReceipt()">'
    +   (rcBusy ? "กำลังส่ง…" : RC_ICON+"ถ่ายใบเสร็จ") + '</button>'
    + '<input type="file" id="rcFile" accept="image/*,application/pdf" capture="environment" style="display:none" onchange="onReceiptFile(this)">'
    + '<div class="mini" style="margin-top:8px">'
    +   (rows.length
        ? ('วันนี้ส่งแล้ว '+rows.length+' ใบ'+(pending?(' · รออ่านยอด '+pending):' · อ่านครบแล้ว'))
        : 'ถ่ายรูปใบเสร็จส่งมาได้เลย ไม่ต้องกรอกยอด')
    + '</div>'
    + lines
    + '</div>';
}

function pickReceipt(){
  const f=document.getElementById("rcFile");
  if(f){ f.value=""; f.click(); }
}

async function onReceiptFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  rcBusy = true; render();
  try{
    const b64 = await new Promise(function(res,rej){
      const rd=new FileReader(); rd.onload=function(){ res(String(rd.result)); }; rd.onerror=rej; rd.readAsDataURL(f);
    });
    const type = /pdf/i.test(f.type) ? "pdf" : "jpg";
    const r = await apiCall("uploadReceipt", {
      dept: state.section, date: todayStr(), fileType: type, fileData: b64, source:"staff" });
    if(r.error) throw new Error(r.error);
    showToast("ส่งใบเสร็จแล้ว");
    await refresh(true);
  }catch(e){ showToast("ส่งไม่สำเร็จ: "+e.message); }
  finally{ rcBusy=false; render(); }
}

async function setReceiptAmount(id, val){
  try{
    const r = await apiCall("savePurchase", { id:id, amount:n2(val), source:"staff" });
    if(r.error) throw new Error(r.error);
    showToast("บันทึกยอดแล้ว");
    await refresh(true);
  }catch(e){ showToast("บันทึกไม่สำเร็จ: "+e.message); }
}

/* =======================================================
   หมวด 2-3 — ต้นทุนเมนู
   ======================================================= */

function deptMenus(d){
  const by = {};
  (d.recipes||[]).forEach(function(r){
    const k = r.menuName;
    if(!by[k]) by[k] = { menuName:k, sellingPrice:n2(r.sellingPrice), servings:n2(r.servings)||1, ingredients:[] };
    by[k].ingredients.push(r);
    if(n2(r.sellingPrice)>0) by[k].sellingPrice = n2(r.sellingPrice);
  });
  return Object.values(by).sort(function(a,b){
    return String(a.menuName).localeCompare(String(b.menuName),"th"); });
}

function menuCost(m){
  let c=0;
  m.ingredients.forEach(function(g){
    const unit = n2(g.packSize)>0 ? n2(g.buyPrice)/n2(g.packSize) : 0;
    c += unit * n2(g.ingredientQty);
  });
  return c / (n2(m.servings)>0 ? n2(m.servings) : 1);
}

function gpColor(gp){
  if(gp>=60) return "var(--green)";
  if(gp>=40) return "var(--amber)";
  return "var(--red)";
}

function renderCost(d){
  const menus = deptMenus(d);
  const addBtn = '<button class="btn" onclick="rcpOpen()" style="margin-bottom:12px">+ เพิ่มเมนู</button>';
  if(!menus.length){
    return addBtn + '<div class="empty"><span class="big">◇</span>ยังไม่มีเมนู — เพิ่มสูตรแรกได้เลย</div>';
  }

  const stats = menus.map(function(m){
    const cost = menuCost(m), price = n2(m.sellingPrice);
    const gp = price>0 ? (price-cost)/price*100 : 0;
    return { m:m, cost:cost, price:price, gp:gp, profit:price-cost };
  }).sort(function(a,b){ return b.gp-a.gp; });

  const avg = stats.filter(function(s){ return s.price>0; });
  const avgGp = avg.length ? avg.reduce(function(a,s){ return a+s.gp; },0)/avg.length : 0;
  const lowGp = stats.filter(function(s){ return s.price>0 && s.gp<30; }).length;

  const kpis =
      '<div class="kpi-grid">'
    +   '<div class="kpi"><p class="kpi-label">จำนวนเมนู</p><p class="kpi-val">'+menus.length+'</p></div>'
    +   '<div class="kpi"><p class="kpi-label">GP เฉลี่ย</p><p class="kpi-val" style="color:'+gpColor(avgGp)+'">'+Math.round(avgGp)+'%</p></div>'
    +   '<div class="kpi '+(lowGp?"bad":"")+'"><p class="kpi-label">เมนูกำไรต่ำ (&lt;30%)</p><p class="kpi-val">'+lowGp+'</p></div>'
    +   '<div class="kpi"><p class="kpi-label">ตั้งราคาแล้ว</p><p class="kpi-val">'+avg.length+'<span class="mini">/'+menus.length+'</span></p></div>'
    + '</div>';

  const rows = stats.map(function(s){
    const name = escapeHtml(s.m.menuName).replace(/'/g,"\\'");
    const ing = s.m.ingredients.map(function(g){
      return escapeHtml(g.ingredientName)+' '+fmtN(g.ingredientQty)+escapeHtml(g.ingredientUnit||""); }).join(" · ");
    return '<div class="it-row" onclick="rcpOpen(\''+name+'\')" style="cursor:pointer">'
      + '<div class="it-top"><div class="it-name">'+escapeHtml(s.m.menuName)+'</div>'
      +   '<div class="mini">ขาย '+fmtB(s.price)+' ฿</div></div>'
      + '<div class="mini" style="margin:4px 0 8px">'+ing+'</div>'
      + '<div style="display:flex;align-items:center;gap:9px">'
      +   '<div class="gauge" style="flex:1;margin:0"><span style="width:'+Math.max(0,Math.min(100,s.gp))+'%;background:'+gpColor(s.gp)+'"></span></div>'
      +   '<b style="color:'+gpColor(s.gp)+';white-space:nowrap">GP '+(s.price>0?Math.round(s.gp)+"%":"—")+'</b>'
      + '</div>'
      + '<div class="mini" style="margin-top:6px">ต้นทุน <b>'+fmtN(s.cost)+'</b> ฿ · กำไร <b>'+fmtN(s.profit)+'</b> ฿</div>'
      + '</div>';
  }).join("");

  return addBtn + kpis + '<div style="font-weight:800;font-size:14px;margin-bottom:8px">เมนูทั้งหมด <span class="mini">เรียงตาม GP</span></div>' + rows;
}

/* ---------------- สูตร / ต้นทุน ---------------- */

const RCP_PLUS = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

function rcpItemList(){
  const d = state.data[state.section] || {items:[]};
  const names = [];
  (d.items||[]).forEach(function(it){
    const n = String(it.name||"").trim();
    if(n && names.indexOf(n)<0) names.push(n);
  });
  return '<datalist id="rcpItems">'
    + names.map(function(n){ return '<option value="'+escapeHtml(n)+'">'; }).join("")
    + '</datalist>';
}

function rcpRow(g){
  g = g || {};
  const cell = 'style="font-size:16px;padding:9px 10px"';
  return '<div class="rcp-row" style="border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px">'
    + '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'
    +   '<input class="rcp-name" list="rcpItems" placeholder="ชื่อวัตถุดิบ" value="'+escapeHtml(g.ingredientName||"")+'" oninput="rcpFill(this)" style="flex:1;font-size:16px;padding:9px 10px">'
    +   '<button type="button" class="btn-sm" onclick="this.closest(\'.rcp-row\').remove();rcpCalc()" style="flex:none;padding:8px 11px">✕</button>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px">'
    +   '<input class="rcp-qty"  inputmode="decimal" placeholder="ใช้" value="'+(g.ingredientQty||"")+'" oninput="rcpCalc()" '+cell+'>'
    +   '<input class="rcp-unit" placeholder="หน่วย" value="'+escapeHtml(g.ingredientUnit||"")+'" '+cell+'>'
    +   '<input class="rcp-buy"  inputmode="decimal" placeholder="ซื้อ ฿" value="'+(g.buyPrice||"")+'" oninput="rcpCalc()" '+cell+'>'
    +   '<input class="rcp-pack" inputmode="decimal" placeholder="ต่อ" value="'+(g.packSize||"")+'" oninput="rcpCalc()" '+cell+'>'
    + '</div></div>';
}

function rcpFill(inp){
  const want = String(inp.value||"").trim();
  const d = state.data[state.section] || {items:[]};
  const it = (d.items||[]).find(function(x){ return String(x.name||"").trim()===want; });
  const row = inp.closest(".rcp-row");
  if(it && row){
    const u=row.querySelector(".rcp-unit"), b=row.querySelector(".rcp-buy"), p=row.querySelector(".rcp-pack");
    if(u && !u.value) u.value = it.unit||"";
    if(b && !b.value && n2(it.cost)>0) b.value = n2(it.cost);
    if(p && !p.value) p.value = 1;
  }
  rcpCalc();
}

function rcpCalc(){
  const sv = document.getElementById("rcpServ");
  const serv = Math.max(1, n2(sv?sv.value:1));
  let total=0;
  document.querySelectorAll(".rcp-row").forEach(function(r){
    const q=n2(r.querySelector(".rcp-qty").value);
    const b=n2(r.querySelector(".rcp-buy").value);
    const p=n2(r.querySelector(".rcp-pack").value);
    if(p>0) total += (b/p)*q;
  });
  const cost = total/serv;
  const pv = document.getElementById("rcpPrice");
  const price = n2(pv?pv.value:0);
  const gp = price>0 ? ((price-cost)/price)*100 : null;
  const out = document.getElementById("rcpOut");
  if(!out) return;
  out.innerHTML =
      '<div class="row"><span class="k">ต้นทุนต่อที่</span><span class="v">'+fmtN(cost)+'</span></div>'
    + '<div class="row"><span class="k">กำไรต่อที่</span><span class="v">'+fmtN(Math.max(0,price-cost))+'</span></div>'
    + '<div class="row"><span class="k">GP</span><span class="v" style="font-size:17px;color:'
    +   (gp===null?"var(--ink-3)":gpColor(gp))+'">'+(gp===null?"—":Math.round(gp)+"%")+'</span></div>';
}

function rcpAdd(){
  const box=document.getElementById("rcpRows");
  if(box){ box.insertAdjacentHTML("beforeend", rcpRow()); rcpCalc(); }
}

function rcpOpen(menuName){
  const d = state.data[state.section] || {recipes:[]};
  const m = menuName ? deptMenus(d).find(function(x){ return x.menuName===menuName; }) : null;
  const rows = m ? m.ingredients : [];
  openSheet(
      '<h3 style="margin-bottom:10px">'+(m?"แก้สูตร "+escapeHtml(m.menuName):"เพิ่มเมนูใหม่")+'</h3>'
    + rcpItemList()
    + '<label class="lbl" style="margin-top:0">ชื่อเมนู</label>'
    + '<input id="rcpName" placeholder="เช่น Flat White" value="'+escapeHtml(m?m.menuName:"")+'">'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    +   '<div><label class="lbl">ราคาขาย ฿</label><input id="rcpPrice" inputmode="decimal" value="'+(m?n2(m.sellingPrice):"")+'" oninput="rcpCalc()"></div>'
    +   '<div><label class="lbl">สูตรนี้ได้กี่ที่</label><input id="rcpServ" inputmode="numeric" value="'+(m?(n2(m.servings)||1):1)+'" oninput="rcpCalc()"></div>'
    + '</div>'
    + '<div style="margin:16px 0 4px;font-weight:700;font-size:14px">วัตถุดิบ</div>'
    + '<div class="mini" style="margin-bottom:8px">ใช้เท่าไร · หน่วย · ราคาที่ซื้อมา · ซื้อมาได้กี่หน่วย</div>'
    + '<div id="rcpRows">'+(rows.length ? rows.map(rcpRow).join("") : rcpRow())+'</div>'
    + '<button type="button" class="btn" onclick="rcpAdd()" style="padding:11px">'+RCP_PLUS+'เพิ่มวัตถุดิบ</button>'
    + '<div id="rcpOut" class="card" style="margin-top:14px;background:var(--surface-2)"></div>'
    + '<div style="display:flex;gap:8px;margin-top:8px">'
    +   (m?'<button class="btn" style="flex:none;width:auto;padding:13px 16px;color:var(--red)" onclick="rcpDelete(\''+escapeHtml(m.menuName).replace(/'/g,"\\'")+'\')">ลบ</button>':"")
    +   '<button class="btn btn-primary" onclick="rcpSubmit()">บันทึกสูตร</button>'
    + '</div>'
  );
  rcpCalc();
}

async function rcpSubmit(){
  const name = String(document.getElementById("rcpName").value||"").trim();
  if(!name){ showToast("ใส่ชื่อเมนูก่อน"); return; }
  const price = n2(document.getElementById("rcpPrice").value);
  const serv  = Math.max(1, n2(document.getElementById("rcpServ").value));
  const rows=[];
  document.querySelectorAll(".rcp-row").forEach(function(r){
    const nm=String(r.querySelector(".rcp-name").value||"").trim();
    if(!nm) return;
    rows.push({ menuName:name, dept:state.section, servings:serv, sellingPrice:price,
      ingredientName:nm,
      ingredientQty:n2(r.querySelector(".rcp-qty").value),
      ingredientUnit:String(r.querySelector(".rcp-unit").value||""),
      buyPrice:n2(r.querySelector(".rcp-buy").value),
      packSize:n2(r.querySelector(".rcp-pack").value) });
  });
  if(!rows.length){ showToast("ใส่วัตถุดิบอย่างน้อย 1 อย่าง"); return; }
  try{
    const res = await apiCall("saveRecipe", { menuName:name, dept:state.section, rows:rows });
    if(res.error) throw new Error(res.error);
    closeModal(); showToast('บันทึกสูตร "'+name+'" แล้ว');
    await refresh(true);
  }catch(e){ showToast("บันทึกไม่สำเร็จ: "+e.message); }
}

async function rcpDelete(menuName){
  if(!confirm('ลบสูตร "'+menuName+'" ?')) return;
  try{
    const res = await apiCall("deleteRecipe", { menuName:menuName, dept:state.section });
    if(res.error) throw new Error(res.error);
    closeModal(); showToast("ลบแล้ว");
    await refresh(true);
  }catch(e){ showToast("ลบไม่สำเร็จ: "+e.message); }
}

tickClock(); setInterval(tickClock, 1000);
bootFromCache();
setSection("summary");
setInterval(function(){
  if(!state.formOpen) refresh(true);
}, 180000);
</script>
